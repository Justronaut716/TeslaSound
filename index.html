<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla Sound Diagnose</title><style>body{font:16px system-ui;background:#10151d;color:#fff;margin:0;padding:24px;max-width:720px}button{padding:14px;border:0;border-radius:9px;margin:5px;background:#3b82f6;color:white;font-size:16px}.panel{background:#202b3a;padding:16px;border-radius:12px;margin:12px 0}strong{font-size:24px}small{color:#b7c2d2}</style></head><body><h1>Tesla Sound – Diagnose</h1><p>GPS, Sensoren und Audio im Tesla-Browser prüfen. Nur im Stand bedienen.</p><button id="start">GPS & Sensoren starten</button><button id="audio">Audiotest</button><div class="panel">GPS: <strong id="gps">Warten</strong><br><small id="gpsmeta">Noch keine Messung</small></div><div class="panel">Bewegungssensor: <strong id="motion">Warten</strong><br><small id="motionmeta">Noch keine Messung</small></div><div class="panel">Audio: <span id="sound">Noch nicht getestet</span></div><p id="status"></p><script>
const el=id=>document.getElementById(id);let last=0,watch=null,ctx=null,osc=null;
el('start').onclick=async()=>{el('status').textContent='Starte Tests…';if(!navigator.geolocation){el('gps').textContent='Nicht verfügbar'}else{try{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(p=>{let now=performance.now(),interval=last?Math.round(now-last):null;last=now;let age=Math.max(0,Math.round((Date.now()-p.timestamp)/1000*10)/10);el('gps').textContent=p.coords.speed===null?'Geschwindigkeit unbekannt':(p.coords.speed*3.6).toFixed(1)+' km/h';el('gpsmeta').textContent='Alter: '+age+' s | Intervall: '+(interval??'–')+' ms | Genauigkeit: '+Math.round(p.coords.accuracy)+' m';},e=>{el('gps').textContent='Fehler '+e.code;el('gpsmeta').textContent=e.message},{enableHighAccuracy:true,maximumAge:0,timeout:15000});}catch(e){el('gpsmeta').textContent=e.message}}
if(typeof DeviceMotionEvent==='undefined'){el('motion').textContent='Nicht unterstützt'}else{try{if(typeof DeviceMotionEvent.requestPermission==='function'){let p=await DeviceMotionEvent.requestPermission();if(p!=='granted')throw Error('Keine Berechtigung')}let count=0,prev=0;window.addEventListener('devicemotion',e=>{let a=e.acceleration||e.accelerationIncludingGravity;count++;if(performance.now()-prev>250){prev=performance.now();el('motion').textContent=a&&a.x!==null?'Aktiv':'Keine Werte';el('motionmeta').textContent=a?'x: '+a.x?.toFixed(2)+' y: '+a.y?.toFixed(2)+' z: '+a.z?.toFixed(2)+' | Ereignisse: '+count:'Keine Beschleunigung verfügbar';}});el('motion').textContent='Listener aktiv';}catch(e){el('motion').textContent='Nicht verfügbar';el('motionmeta').textContent=e.message}}el('status').textContent='Diagnose läuft';};
el('audio').onclick=async()=>{try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(osc){osc.stop();osc.disconnect();osc=null;el('sound').textContent='Gestoppt';return}osc=ctx.createOscillator();let gain=ctx.createGain();gain.gain.value=.035;osc.type='sawtooth';osc.frequency.value=95;osc.connect(gain).connect(ctx.destination);osc.start();el('sound').textContent='Ton läuft – erneut tippen zum Stoppen';}catch(e){el('sound').textContent='Fehler: '+e.message}};
</script></body></html>
